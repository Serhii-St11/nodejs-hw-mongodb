openapi: 3.1.0
info:
  title: Contact Book API
  version: 1.0.0
  description: REST API for managing contacts
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: https://nodejs-hw-07-zs16.onrender.com

tags:
  - name: Contacts
    description: Manage user contacts

paths:
  /contacts:
    get:
      tags:
        - Contacts
      summary: Get all contacts
      operationId: getContacts
      description: Retrieve a paginated list of contacts with optional filter by favourite status
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: isFavourite
          in: query
          required: false
          schema:
            type: boolean
            example: true
      responses:
        '200':
          description: A paginated list of contacts
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Successfully found contacts!
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Contact'
                      page:
                        type: integer
                        example: 1
                      perPage:
                        type: integer
                        example: 10
                      totalItems:
                        type: integer
                        example: 25
                      totalPages:
                        type: integer
                        example: 3
                      hasPreviousPage:
                        type: boolean
                        example: false
                      hasNextPage:
                        type: boolean
                        example: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags:
        - Contacts
      summary: Create a new contact
      operationId: createContact
      description: Create a new contact with required fields
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - phoneNumber
                - contactType
              properties:
                name:
                  type: string
                  example: Ivan Test
                email:
                  type: string
                  format: email
                  example: test22555prob@gmail.com
                phoneNumber:
                  type: string
                  example: +380991234567
                contactType:
                  type: string
                  enum: [work, home, personal]
                  example: work
                isFavourite:
                  type: boolean
                  example: true
                photo:
                  type: string
                  format: binary
      responses:
        '201':
          description: Successfully created a contact
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: Successfully created a contact!
                  data:
                    $ref: '#/components/schemas/Contact'
        '400':
          description: Invalid input
          content:
            application/json:
              examples:
                invalidEmail:
                  value:
                    status: 400
                    message: '"email" must be a valid email'
                invalidContactType:
                  value:
                    status: 400
                    message: '"contactType" must be one of [work, home, personal]'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /contacts/{contactId}:
    get:
      tags:
        - Contacts
      summary: Get contact by ID
      operationId: getContactById
      description: Get a single contact by its ID
      security:
        - bearerAuth: []
      parameters:
        - name: contactId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successfully found contact
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Successfully found contact!
                  data:
                    $ref: '#/components/schemas/Contact'
        '400':
          description: Invalid input
          content:
            application/json:
              example:
                status: 400
                message: Invalid input
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Contact not found
          content:
            application/json:
              example:
                status: 404
                message: Contact not found

    patch:
      tags:
        - Contacts
      summary: Update a contact
      operationId: updateContact
      description: Update a contact by ID
      security:
        - bearerAuth: []
      parameters:
        - name: contactId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                phoneNumber:
                  type: string
                contactType:
                  type: string
                  enum: [work, home, personal]
                isFavourite:
                  type: boolean
                photo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Successfully updated contact
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Successfully patched a contact!
                  data:
                    $ref: '#/components/schemas/Contact'
        '400':
          description: Invalid input
          content:
            application/json:
              example:
                status: 400
                message: '"contactType" must be one of [work, home, personal]'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Contact not found
          content:
            application/json:
              example:
                status: 404
                message: Contact not found

    delete:
      tags:
        - Contacts
      summary: Delete a contact
      operationId: deleteContact
      description: Delete a contact by ID
      security:
        - bearerAuth: []
      parameters:
        - name: contactId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Contact deleted successfully (no content)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Contact not found
          content:
            application/json:
              example:
                status: 404
                message: Contact not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Contact:
      type: object
      properties:
        _id:
          type: string
          example: 684da4b8efa1b6fa25f0f595
        name:
          type: string
          example: Hello
        email:
          type: string
          example: john.doe@example.com
        phoneNumber:
          type: string
          example: +380632715337
        contactType:
          type: string
          enum: [work, home, personal]
          example: work
        isFavourite:
          type: boolean
          example: false
        userId:
          type: string
          example: 684b16eba2ff42270a5d06dd
        photo:
          type: string
          example: https://res.cloudinary.com/.../sample.jpg
        createdAt:
          type: string
          format: date-time
          example: 2025-06-14T16:35:04.026Z
        updatedAt:
          type: string
          format: date-time
          example: 2025-06-14T16:35:04.026Z

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          example:
            status: 401
            message: Unauthorized

    Forbidden:
      description: Forbidden
      content:
        application/json:
          example:
            status: 403
            message: Forbidden
