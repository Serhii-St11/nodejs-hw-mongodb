openapi: 3.1.0
info:
  title: Contact Book API
  version: 1.0.0
  description: REST API for managing contacts
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: https://nodejs-hw-07-zs16.onrender.com
  - url: http://localhost:3000

tags:
  - name: Contacts
    description: Manage user contacts

paths:
  /contacts:
    get:
      tags:
        - Contacts
      summary: Get all contacts
      operationId: getContacts
      description: Retrieve a paginated list of contacts
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
          description: Page number
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: Number of items per page
        - name: isFavourite
          in: query
          required: false
          schema:
            type: boolean
          description: Filter contacts by favourite status
      responses:
        '200':
          description: A list of contacts
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Successfully found contacts!
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contact'
                  totalPages:
                    type: integer
                    example: 3
                  currentPage:
                    type: integer
                    example: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags:
        - Contacts
      summary: Create a new contact
      operationId: createContact
      description: Create a new contact with required fields
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - phoneNumber
                - contactType
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                phoneNumber:
                  type: string
                contactType:
                  type: string
                  enum: [friend, family, work, other]
                isFavourite:
                  type: boolean
                photo:
                  type: string
                  format: binary
      responses:
        '201':
          description: Successfully created a contact
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: Successfully created a contact!
                  data:
                    $ref: '#/components/schemas/Contact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /contacts/{contactId}:
    get:
      tags:
        - Contacts
      summary: Get contact by ID
      operationId: getContactById
      description: Get a single contact by its ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: contactId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Found contact by ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Successfully found contact!
                  data:
                    $ref: '#/components/schemas/Contact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    patch:
      tags:
        - Contacts
      summary: Update a contact
      operationId: updateContact
      description: Update a contact by ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: contactId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                phoneNumber:
                  type: string
                contactType:
                  type: string
                  enum: [friend, family, work, other]
                isFavourite:
                  type: boolean
                photo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Successfully updated contact
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Successfully patched a contact!
                  data:
                    $ref: '#/components/schemas/Contact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      tags:
        - Contacts
      summary: Delete a contact
      operationId: deleteContact
      description: Delete a contact by ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: contactId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Contact deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Contact:
      type: object
      properties:
        _id:
          type: string
          example: "684da4b8efa1b6fa25f0f595"
        name:
          type: string
          example: "Hello"
        email:
          type: string
          example: "john.doe@example.com"
        phoneNumber:
          type: string
          example: "+380632715337"
        contactType:
          type: string
          example: "friend"
        isFavourite:
          type: boolean
          example: false
        userId:
          type: string
          example: "684b16eba2ff42270a5d06dd"
        photo:
          type: string
          example: "https://res.cloudinary.com/.../sample.jpg"
        createdAt:
          type: string
          format: date-time
          example: "2025-06-14T16:35:04.026Z"
        updatedAt:
          type: string
          format: date-time
          example: "2025-06-14T16:35:04.026Z"

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 400
              message:
                type: string
                example: Invalid input

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 401
              message:
                type: string
                example: Unauthorized

    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 403
              message:
                type: string
                example: Forbidden

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 404
              message:
                type: string
                example: Contact not found
