openapi: 3.0.0
info:
  title: Contact Book API
  version: 1.0.0
  description: REST API for managing contacts
servers:
  - url: https://nodejs-hw-07-zs16.onrender.com
tags:
  - name: Contacts
    description: Manage user contacts
paths:
  /contacts:
    post:
      summary: Create a new contact
      tags:
        - Contacts
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: John Doe
                email:
                  type: string
                  format: email
                  example: john.doe@example.com
                phoneNumber:
                  type: string
                  example: "+380500505555"
                isFavourite:
                  type: boolean
                  example: false
                photo:
                  type: string
                  format: binary
      responses:
        '201':
          description: Successfully created a contact
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: Successfully created a contact!
                  data:
                    $ref: '#/components/schemas/Contact'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contacts/{contactId}:
    get:
      summary: Get contact by ID
      tags:
        - Contacts
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: contactId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Contact found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Successfully found contact with id 684da4b8efa1b6fa25f0f595!
                  data:
                    $ref: '#/components/schemas/Contact'
        '400':
          description: Invalid contact ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: Invalid contact ID
        '404':
          description: Contact not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      summary: Update contact by ID
      tags:
        - Contacts
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: contactId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Jane Smith
                email:
                  type: string
                  format: email
                  example: jane@example.com
                phoneNumber:
                  type: string
                  example: "+380632715337"
                isFavourite:
                  type: boolean
                  example: true
                photo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Successfully updated contact
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Successfully patched a contact!
                  data:
                    $ref: '#/components/schemas/Contact'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Contact not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete contact by ID
      tags:
        - Contacts
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: contactId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Contact successfully deleted
        '404':
          description: Contact not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Contact:
      type: object
      properties:
        _id:
          type: string
          example: "684da4b8efa1b6fa25f0f595"
        name:
          type: string
          example: "Hello"
        email:
          type: string
          example: "john.doe@example.com"
        phoneNumber:
          type: string
          example: "+380632715337"
        isFavourite:
          type: boolean
          example: false
        userId:
          type: string
          example: "684b16eba2ff42270a5d06dd"
        photo:
          type: string
          example: "https://res.cloudinary.com/dn08o1oqs/image/upload/v1749918903/contacts_photos/sample.jpg"
        createdAt:
          type: string
          format: date-time
          example: "2025-06-14T16:35:04.026Z"
        updatedAt:
          type: string
          format: date-time
          example: "2025-06-14T16:35:04.026Z"

    Error:
      type: object
      properties:
        status:
          type: integer
          example: 404
        message:
          type: string
          example: Contact not found
